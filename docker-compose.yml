services:
  storage-api:
    build: .
    container_name: vps_storage_hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - BASE_URL=http://YOUR_VPS_IP:3000
      - MASTER_KEY=vps_secret_admin_key_2026
      - STORAGE_DIR=/app/uploads
      - DB_PATH=/app/data/storage.db
      - MAX_FILE_SIZE_MB=500
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
