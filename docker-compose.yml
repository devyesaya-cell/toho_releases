services:
  storage-api:
    build: .
    container_name: vps_storage_hub
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - BASE_URL=https://storage.devtoho.cloud
      - MASTER_KEY=S4tuN0Lkeymaster
      - STORAGE_DIR=/app/uploads
      - DB_PATH=/app/data/storage.db
      - MAX_FILE_SIZE_MB=500
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
